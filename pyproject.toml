[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heat"
version = "0.1.0"
description = "初中物理热量计算与练习纸生成工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["python", "education", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Natural Language :: Chinese (Simplified)",
]

[project.scripts]
heat = "heat.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/heat"
Source = "https://github.com/eastyou/heat"

[tool.setuptools]
packages = ["heat"]
